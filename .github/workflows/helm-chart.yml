name: Helm chart

# Pull requests and pushes to main lint and render the chart.
# Pushing a tag named taranac-<chart version> (for example taranac-0.1.0)
# publishes it as an OCI artifact to ghcr.io/<owner>/charts/taranac.

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart.yml"
    tags: ["taranac-*"]

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CHART_DIR: charts/taranac

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Fails if Chart.lock is out of sync with Chart.yaml.
      - name: Build dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint
        run: |
          helm lint "$CHART_DIR"
          for f in "$CHART_DIR"/ci/*.yaml; do
            echo "::group::lint $f"
            helm lint "$CHART_DIR" -f "$f"
            echo "::endgroup::"
          done

      - name: Render
        run: |
          helm template ci "$CHART_DIR" > /dev/null
          for f in "$CHART_DIR"/ci/*.yaml; do
            echo "::group::template $f"
            helm template ci "$CHART_DIR" -f "$f" > /dev/null
            echo "::endgroup::"
          done

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/taranac-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: sigstore/cosign-installer@v3

      - name: Check tag matches chart version
        run: |
          tag_version="${GITHUB_REF_NAME#taranac-}"
          chart_version="$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "::error::tag version '$tag_version' does not match Chart.yaml version '$chart_version'"
            exit 1
          fi

      - name: Build dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push
        id: push
        run: |
          # OCI repository names must be lowercase.
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm package "$CHART_DIR" --destination dist
          out="$(helm push dist/*.tgz "oci://$repo")"
          echo "$out"
          digest="$(echo "$out" | awk '/^Digest:/ {print $2}')"
          [ -n "$digest" ] || { echo "::error::could not read pushed digest"; exit 1; }
          echo "ref=$repo/taranac@$digest" >> "$GITHUB_OUTPUT"

      - name: Sign
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.push.outputs.ref }}"
            echo '```'
            echo "Install: \`helm install taranac oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/taranac --version ${GITHUB_REF_NAME#taranac-}\`"
          } >> "$GITHUB_STEP_SUMMARY"
