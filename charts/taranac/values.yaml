# Default values for the Taranac chart.
#
# The defaults give a working single-instance install on a typical cluster:
# PostgreSQL comes from the bundled subchart, all application keys are
# generated on first install, and the cluster's default StorageClass is used.

nameOverride: ""
fullnameOverride: ""

# Cluster DNS domain, used to build in-cluster FQDNs for the nginx configs.
clusterDomain: cluster.local

# DNS resolver nginx should use inside the pods. Empty = auto-detect from the
# pod's /etc/resolv.conf (correct for CoreDNS, kube-dns and NodeLocal DNSCache).
dnsResolver: ""

# Names of existing image pull Secrets, applied to every Taranac pod.
imagePullSecrets: []

commonLabels: {}
commonAnnotations: {}

global:
  # Replace the registry host of every Taranac image (private mirror / air gap).
  imageRegistry: ""

image:
  # Default tag for every Taranac image. Empty = the chart appVersion.
  tag: ""
  # Empty = Kubernetes default (Always for :latest, IfNotPresent otherwise).
  pullPolicy: ""

config:
  # Public DNS name of the web UI; the default Ingress host.
  domain: taranac.example.com
  timezone: UTC
  supportedLocales: "en,de,es,fr,pt"

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # None of the workloads talk to the Kubernetes API.
  automount: false

# --------------------------------------------------------------------------
# Application secrets
# --------------------------------------------------------------------------
secrets:
  # Use your own Secret instead of the chart-managed one. It must contain the
  # keys: MASTER_KEY, SECRET_KEY, EST_PROXY_KEY, TARANAC_MFA_API_KEY,
  # REPORTS_RENDERER_API_KEY (and POSTGRES_PASSWORD when using an external
  # database without externalDatabase.existingSecret).
  existingSecret: ""
  # Explicit values for the chart-managed Secret. Any key left empty is
  # generated on first install and then preserved across upgrades (via
  # `lookup`). Example: { MASTER_KEY: "<openssl rand -base64 32>" }.
  #
  # GitOps note: renderers that cannot `lookup` (Argo CD, `helm template`)
  # regenerate generated keys on every render. MASTER_KEY encrypts data at rest,
  # so with those tools always set values here or use existingSecret.
  values: {}

# --------------------------------------------------------------------------
# Database
# --------------------------------------------------------------------------
database:
  # Names used by the application (and created in the bundled PostgreSQL).
  user: taranac
  name: taranac
  mfaName: taranac_mfa

# Bundled PostgreSQL (Bitnami subchart). This is the default; set
# postgresql.enabled=false and fill in externalDatabase to use your own.
postgresql:
  enabled: true
  auth:
    # Keep in sync with `database` above.
    username: taranac
    database: taranac
    # The password is generated by the subchart. To supply your own, set
    # auth.password, or point at a Secret with auth.existingSecret and
    # auth.secretKeys.{adminPasswordKey,userPasswordKey}.
    existingSecret: ""
  primary:
    persistence:
      size: 10Gi
      # storageClass: ""   # empty = cluster default
    extendedConfiguration: |-
      max_connections = 300
    initdb:
      args: "--data-checksums"
      # Runs once against an empty data directory. Keep in sync with `database`.
      scripts:
        10-init-mfa.sql: |
          CREATE DATABASE taranac_mfa OWNER taranac;

# External PostgreSQL, used only when postgresql.enabled=false.
#
# Each connection detail can come from an inline value, a ConfigMap or a
# Secret, so non-sensitive and sensitive parts can live in different places.
# Precedence per field: inline value (or uri) > existingConfigMap key >
# existingSecret key > default.
#
# CloudNativePG: point existingSecret at the generated "<cluster>-app" Secret
# and map its standard keys:
#   existingSecret: my-cluster-app
#   existingSecretKeys: {host: host, port: port, user: user, name: dbname}
# The MFA database (database.mfaName) must already exist on the server.
externalDatabase:
  host: ""
  port: ""            # default 5432
  user: ""            # default database.user (when no ConfigMap/Secret key is mapped)
  name: ""            # default database.name (when no ConfigMap/Secret key is mapped)
  mfaName: ""         # default database.mfaName
  password: ""        # stored in the chart-managed Secret; prefer existingSecret
  # Alternative to the discrete fields: postgresql://user:pass@host:5432/dbname
  # (inline only; the password is split out into the chart-managed Secret and
  # must therefore be URL-safe).
  uri: ""
  # Secret holding the password (and optionally other fields). Not chart-managed.
  existingSecret: ""
  existingSecretKeys:
    password: password     # CloudNativePG key name
    host: ""
    port: ""
    user: ""
    name: ""
  # ConfigMap holding non-sensitive fields.
  existingConfigMap: ""
  existingConfigMapKeys:
    host: host
    port: port
    user: user
    name: dbname

# --------------------------------------------------------------------------
# Storage
# --------------------------------------------------------------------------
persistence:
  # Shared state (certificates, backups), mounted by the core, frontend and
  # renderer pods. Defaults to ReadWriteOnce so it works on any StorageClass; the
  # chart then co-schedules those pods on one node. With an RWX-capable class set
  # accessModes to ["ReadWriteMany"] to let them spread across nodes.
  state:
    existingClaim: ""
    storageClass: ""   # empty = cluster default
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    annotations: {}
  # Logs (api, AAA, tacacs, radius, nac, winbind) and uploaded vendor RADIUS
  # dictionaries, which Compose keeps in named volumes. Mounted by the core pod
  # only, so ReadWriteOnce is enough.
  # The mfa service's encryption key (push tokens are undecryptable without it).
  mfa:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}
  data:
    enabled: true
    existingClaim: ""
    storageClass: ""   # empty = cluster default
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    annotations: {}

# --------------------------------------------------------------------------
# Networking
# --------------------------------------------------------------------------
# The web UI is served through the Ingress below. Everything else Taranac speaks
# (TACACS+, RADIUS, EST, SCEP) is raw TCP/UDP and is exposed with Services. Two
# Services are created
# because many load balancers cannot mix TCP and UDP on one Service; to share a
# single IP between them use your load balancer's own annotations, e.g.
# MetalLB: metallb.universe.tf/allow-shared-ip: "taranac" and
# metallb.universe.tf/loadBalancerIPs: "192.168.1.50".
#
# Each entry in `ports` may set port, targetPort, protocol and nodePort. Set an
# entry to null to drop it.
service:
  # One LoadBalancer Service carrying both TCP and UDP ports (one IP, no
  # sharing annotations needed). Requires Kubernetes >= 1.26 and a load balancer
  # that supports mixed protocols (MetalLB and most clouds do). Set false for
  # separate tcp/udp Services. When true, type/annotations/etc. come from `tcp`.
  combined: true
  tcp:
    enabled: true
    type: LoadBalancer
    annotations: {}
    labels: {}
    loadBalancerIP: ""
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    # Local keeps client source IPs, which matters for RADIUS/TACACS+ policy.
    externalTrafficPolicy: ""
    ports:
      tacacs: {port: 49, targetPort: 49}
      tacacs-tls: {port: 6049, targetPort: 6049}
      est-gateway: {port: 8445, targetPort: 8443}
      scep-http: {port: 8446, targetPort: 8080}
  udp:
    enabled: true
    type: LoadBalancer
    annotations: {}
    labels: {}
    loadBalancerIP: ""
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    ports:
      radius-auth: {port: 1812, targetPort: 1812}
      radius-acct: {port: 1813, targetPort: 1813}
      nac-auth: {port: 1814, targetPort: 1814}
      nac-acct: {port: 1815, targetPort: 1815}
      nac-coa: {port: 3799, targetPort: 3799}

# NetworkPolicies (only enforced if the cluster CNI supports them; harmless
# otherwise). When enabled: renderer and mfa accept traffic only from Taranac pods (and mfa also
# from `mfa.extraIngress` peers, e.g. your ingress controller if phones reach it
# through one); the api accepts only Taranac pods; frontend accepts anything;
# the core's TACACS+/RADIUS/NAC/EST/SCEP ports stay open to all sources.
networkPolicy:
  enabled: true

# Web UI. Routes to the frontend Service (plain HTTP, port 80), which serves
# the UI and proxies /api to the backend; there is no separate edge proxy, so
# TLS terminates here. With no className the cluster's default IngressClass is
# used. Requires an ingress controller.
#
# Taranac needs from the controller (names below are ingress-nginx's; use your
# controller's equivalents):
#   * request bodies up to 25 MB for collector uploads (/api/v1/ncm/collector/*;
#     the frontend caps every other API path at 3 MB)  proxy-body-size: "25m"
#   * read/send timeouts of 600s for bulk operations   proxy-read-timeout: "600"
#   * trustworthy X-Forwarded-{For,Proto,Host,Port} and X-Real-IP headers. There
#     is no edge proxy to overwrite them any more, and the core builds
#     collector/portal URLs and records client IPs from them. The controller
#     must not accept them from clients (see the chart README).
# Example:
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-body-size: "25m"
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
ingress:
  enabled: true
  className: ""
  annotations: {}
  # Defaults to [config.domain].
  hosts: []
  # Standard Ingress TLS list, e.g. [{secretName: taranac-tls, hosts: [taranac.example.com]}].
  # Ignored when certManager.enabled (which generates it).
  tls: []
  # cert-manager (https://cert-manager.io): adds the issuer annotation and a TLS
  # entry for all hosts, with the certificate stored in <fullname>-tls.
  # Set exactly one of clusterIssuer / issuer.
  certManager:
    enabled: false
    clusterIssuer: ""
    issuer: ""

# --------------------------------------------------------------------------
# Keel (https://keel.sh) automatic image updates
# --------------------------------------------------------------------------
# Two integrations, pick one:
#
# 1. Kubernetes provider: set keel.enabled=true and the chart annotates the
#    Taranac Deployments/StatefulSet. Keel patches the live workloads, so the
#    next `helm upgrade` resets images to the values below unless you pass the
#    current tags (or use the Helm provider).
#
# 2. Helm provider: Keel reads this same `keel` block from the release values
#    and upgrades the release. Populate `keel.images` (see
#    examples/values-keel-helm.yaml) and leave keel.enabled=false.
#
# The default image tag is the release in Chart.yaml appVersion, so the default
# policy follows semver minor/patch releases. For a moving tag (:latest) set
# image.tag=latest with policy: force and matchTag: true.
keel:
  enabled: false
  policy: minor
  trigger: poll
  pollSchedule: "@every 5m"
  matchTag: false
  approvals: 0
  approvalDeadline: ""
  notify: ""
  # Extra annotations merged onto the workloads (Kubernetes provider).
  annotations: {}
  # Helm provider image map; empty = Helm provider ignores this release.
  images: []

# --------------------------------------------------------------------------
# Workloads
# --------------------------------------------------------------------------
# Every container accepts: image {repository, tag, digest, pullPolicy},
# resources, securityContext, extraEnv, extraEnvFrom.

# Pod-level settings for the multi-container core StatefulSet.
core:
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: null
  # Mount the node's /etc read-only at /host/etc, as Compose mounts the host
  # filesystem for the "host monitoring" page. Off by default: it needs a
  # hostPath volume (blocked by the baseline Pod Security level) and in a pod
  # shows the node rather than "the appliance".
  hostEtc:
    enabled: false

api:
  image: {repository: ghcr.io/taranaclabs/taranac/api, tag: "", digest: "", pullPolicy: ""}
  # /healthz is served over HTTPS; kubelet does not verify the certificate.
  # A first start runs migrations (and, on a replica, waits for the schema), so
  # the startup probe allows up to 10 minutes.
  startupProbe:
    httpGet: {path: /healthz, port: 8000, scheme: HTTPS}
    periodSeconds: 10
    failureThreshold: 60
  readinessProbe:
    httpGet: {path: /healthz, port: 8000, scheme: HTTPS}
    periodSeconds: 10
  livenessProbe:
    httpGet: {path: /healthz, port: 8000, scheme: HTTPS}
    periodSeconds: 30
    failureThreshold: 5
  resources: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

winbind:
  image: {repository: ghcr.io/taranaclabs/taranac/winbind, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

tacacs:
  image: {repository: ghcr.io/taranaclabs/taranac/tacacs, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

radius:
  image: {repository: ghcr.io/taranaclabs/taranac/radius, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

nac:
  image: {repository: ghcr.io/taranaclabs/taranac/nac, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

estGateway:
  image: {repository: ghcr.io/taranaclabs/taranac/est-gateway, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

frontend:
  replicaCount: 1
  image: {repository: ghcr.io/taranaclabs/taranac/frontend, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  podSecurityContext: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Hold nginx back until the core pod has minted the internal CA it verifies
  # the API with (otherwise it crash-loops on first start).
  waitForCerts: true
  readinessProbe:
    tcpSocket: {port: http}
    periodSeconds: 10
  livenessProbe:
    tcpSocket: {port: http}
    periodSeconds: 30
  extraEnv: []
  extraEnvFrom: []

renderer:
  replicaCount: 1
  # Hold the renderer back until the core pod has minted its certificates.
  waitForCerts: true
  image: {repository: ghcr.io/taranaclabs/taranac/renderer, tag: "", digest: "", pullPolicy: ""}
  resources: {}
  securityContext: {}
  podSecurityContext: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  readinessProbe:
    tcpSocket: {port: https}
    periodSeconds: 10
  livenessProbe: {}
  extraEnv: []
  extraEnvFrom: []

mfa:
  replicaCount: 1
  image: {repository: ghcr.io/taranaclabs/taranac/mfa, tag: "", digest: "", pullPolicy: ""}
  # Verify the TLS certificate of internal service calls.
  internalTlsVerify: false
  # Optional Firebase service-account key for push notifications: a Secret with
  # the key `firebase-credentials.json`. Without it mfa runs poll-only.
  firebase:
    existingSecret: ""
  # Extra NetworkPolicy peers allowed to reach mfa (networkPolicy.enabled), e.g.
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}].
  extraIngress: []
  resources: {}
  securityContext: {}
  # The mfa image runs as uid/gid 999; fsGroup makes its data volume writable.
  podSecurityContext:
    fsGroup: 999
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  readinessProbe:
    tcpSocket: {port: https}
    periodSeconds: 10
  livenessProbe: {}
  extraEnv: []
  extraEnvFrom: []
