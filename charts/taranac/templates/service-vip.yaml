{{- $fullname := include "taranac.fullname" . }}
{{- $ctx := dict "root" . "component" "core" }}
{{- /* Each entry: Service-name suffix, settings source, protocols carried. */}}
{{- $groups := list (list "tcp" "tcp" (list "tcp")) (list "udp" "udp" (list "udp")) }}
{{- if .Values.service.combined }}
{{- $groups = list (list "vip" "tcp" (list "tcp" "udp")) }}
{{- end }}
{{- range $g := $groups }}
{{- $suffix := index $g 0 }}
{{- $svc := index $.Values.service (index $g 1) }}
{{- $protos := index $g 2 }}
{{- if $svc.enabled }}
{{- $exposed := or (eq $svc.type "LoadBalancer") (eq $svc.type "NodePort") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-vip{{ if ne $suffix "vip" }}-{{ $suffix }}{{ end }}
  labels:
    {{- include "taranac.labels" $ctx | nindent 4 }}
    {{- with $svc.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- if and $exposed $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  {{- if eq $svc.type "LoadBalancer" }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "taranac.selectorLabels" $ctx | nindent 4 }}
  ports:
    {{- range $proto := $protos }}
    {{- range $name, $p := (index $.Values.service $proto).ports }}
    {{- if $p }}
    - name: {{ $name }}
      port: {{ $p.port }}
      targetPort: {{ default $p.port $p.targetPort }}
      protocol: {{ default (upper $proto) $p.protocol }}
      {{- if and $exposed $p.nodePort }}
      nodePort: {{ $p.nodePort }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
