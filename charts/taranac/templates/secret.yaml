{{- if not .Values.secrets.existingSecret }}
{{- $name := include "taranac.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $provided := deepCopy (.Values.secrets.values | default dict) }}
{{- /* Generated once, then preserved across upgrades. MASTER_KEY has the shape of `openssl rand -base64 32`; the others that of `openssl rand -hex 32`. */}}
{{- $generated := dict
  "MASTER_KEY" (randAlphaNum 32 | b64enc)
  "SECRET_KEY" (randAlphaNum 64 | sha256sum)
  "EST_PROXY_KEY" (randAlphaNum 64 | sha256sum)
  "TARANAC_MFA_API_KEY" (randAlphaNum 64 | sha256sum)
  "REPORTS_RENDERER_API_KEY" (randAlphaNum 64 | sha256sum) }}
{{- /* External database password lives here unless it comes from a Secret. */}}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- $parsed := include "taranac.db.parsed" . | fromJson }}
{{- $_ := set $provided "POSTGRES_PASSWORD" (required "externalDatabase.password (or a password in externalDatabase.uri, or externalDatabase.existingSecret) is required when postgresql.enabled=false" (coalesce .Values.externalDatabase.password (get $parsed "password"))) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "taranac.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- $final := dict }}
  {{- range $key := keys $generated $provided | uniq | sortAlpha }}
  {{- $_ := set $final $key (coalesce (get $provided $key) (get $existing $key | b64dec) (get $generated $key)) }}
  {{ $key }}: {{ get $final $key | b64enc | quote }}
  {{- end }}
  {{- /* The api's backup/restore reads the deployment's env file from /app/host/env (compose bind-mounts .env there); this is the same content. */}}
  host.env: {{ include "taranac.hostEnv" $final | b64enc | quote }}
{{- end }}
